# rotating logs so they do not overflow
x-logging:
  logging: &default-logging
    driver: "local"
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    #build: .
    image: ${DOCKER_REGISTRY_PREFIX}yolo-label-studio:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
    #   Optional: Specify SSL termination certificate & key
    #   Just drop your cert.pem and cert.key into folder 'deploy/nginx/certs'
    #      - NGINX_SSL_CERT=/certs/cert.pem
    #      - NGINX_SSL_CERT_KEY=/certs/cert.key
    volumes:
      - ${LABEL_DATA_VOLUME:-./mydata}:/label-studio/data:rw
      - ./nginx/certs:/certs:ro
    #   Optional: Override nginx default conf
    #      - ./deploy/my.conf:/etc/nginx/nginx.conf
    command: nginx

  app:
    stdin_open: true
    tty: true
    build: .
    image: ${DOCKER_REGISTRY_PREFIX}yolo-label-studio:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db
      - redis
      - minio
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=${POSTGRES_DATABASE:-postgres}
      - POSTGRE_USER=${POSTGRES_USER:-postgres}
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRE_HOST=db
      - POSTGRE_PORT=${POSTGRES_PORT:-5432}
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - LABEL_STUDIO_MINIO_ADDRESS=${LABEL_STUDIO_MINIO_ADDRESS:-}
      - JSON_LOG=0
      - TZ:Asia/Shanghai
      - MINIO_STORAGE_ENDPOINT=${MINIO_ENDPOINT-minio}
      - MINIO_STORAGE_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_STORAGE_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_STORAGE_BUCKET_NAME=${MINIO_BUCKET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    #      - LOG_LEVEL=DEBUG
    volumes:
      - ${LABEL_DATA_VOLUME:-./mydata}:/label-studio/data:rw
    command: label-studio-uwsgi

  rq:
    stdin_open: true
    tty: true
    build: .
    image: ${DOCKER_REGISTRY_PREFIX}yolo-label-studio:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - minio
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=${POSTGRES_DATABASE:-postgres}
      - POSTGRE_USER=${POSTGRES_USER:-postgres}
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRE_HOST=db
      - POSTGRE_PORT=${POSTGRES_PORT:-5432}
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - LABEL_STUDIO_MINIO_ADDRESS=${LABEL_STUDIO_MINIO_ADDRESS:-}
      - JSON_LOG=0
      - TZ:Asia/Shanghai
      - MINIO_STORAGE_ENDPOINT=${MINIO_ENDPOINT-minio}
      - MINIO_STORAGE_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_STORAGE_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_STORAGE_BUCKET_NAME=${MINIO_BUCKET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RQ_DEFAULT_TIMEOUT=600
      - RQ_DATASET_TIMEOUT=1800
      - RQ_TRAINING_TIMEOUT=3600
      - YOLO_TRAIN_DEVICE=${TRAIN_DEVICE:-cpu}
    #      - LOG_LEVEL=DEBUG
    volumes:
      - ${LABEL_DATA_VOLUME:-./mydata}:/label-studio/data:rw
    command: rq-worker

  db:
    image: ${DOCKER_REGISTRY_PREFIX}yolo-pgautoupgrade:${IMAGE_TAG}
    hostname: db
    restart: unless-stopped
    # Optional: Enable TLS on PostgreSQL
    # Just drop your server.crt and server.key into folder 'deploy/pgsql/certs'
    # NOTE: Both files must have permissions u=rw (0600) or less
    #    command: >
    #      -c ssl=on
    #      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
    #      -c ssl_key_file=/var/lib/postgresql/certs/server.key
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DATABASE:-postgres}
      - POSTGRES_INITDB_ARGS:"--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      - TZ:Asia/Shanghai
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${POSTGRES_DATA_VOLUME:-./postgres-data}:/var/lib/postgresql/data
      - ./pgsql/certs:/var/lib/postgresql/certs:ro

  redis:
    image: redis:5
    restart: always
    command: ["redis-server"]
    volumes:
      - ${REDIS_DATA_VOLUME:-./redis-data}:/data

  minio:
    image: quay.io/minio/minio:${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9009"
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9000:9000"
      - "9009:9009"
    volumes:
      - ${MINIO_DATA_VOLUME:-minio-data}:/data
    # configure env vars in .env file or your systems environment
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-MinPass12345678}
    # 添加健康检查
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    profiles:
      - minio

  minio-buckets:
    image: quay.io/minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-05-21T01-59-54Z}
    depends_on:
      minio:
        condition: service_healthy  # 等待 minio 健康状态
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 10; 
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET-labelstudio};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET-labelstudio};
      /usr/bin/mc admin accesskey create myminio --name labelstudio-key --access-key ${MINIO_ACCESS_KEY} --secret-key ${MINIO_SECRET_KEY};
      exit 0;
      "
    profiles:
      - minio
